<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML template with form">
    <title>Form Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        form {
            background-color: gray;
            padding: 20px;                    /* inside spacing of form elements */
            max-width: 400px;                 /* constricts width of entire form */
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 15px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Contact Form</h1>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
