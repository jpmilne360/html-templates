<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Structured HTML template">
    <title>Template 02 - Structure</title>
</head>
<body>
    <header>
        <h1>Title</h1>
        <p>&ltheader&gt and &lth1&gt tag for header and headings.</p>
    </header>

    <main>
        <section>
            <h2>Section</h2>
            <p>&ltmain&gt tag nests &ltsection&gt</p>
        </section>

        <article>
            <h2>Article Title</h2>
            <p>&ltmain&gt tag nests &ltarticle&gt</p>
        </article>
    </main>

    <footer>
        <p>&copy; symbol in &ltfooter&gt</p>
    </footer>

</body>
</html>
