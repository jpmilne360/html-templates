<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML template with navigation">
    <title>Template 03 - Navigation</title>    
    <!-- 
        Styling within the header controlling nav display.
        In practice it's almost always a seperate stylesheet though. 
    -->
    <style>
        nav ul {
            display: flex;
            list-style: none; /* list-style attribute of none will remove the  bullet points */
            padding: 0;
            margin: 0;
            gap: 20px; /* gap attribute will add spacing between the nav ul elements */
        }
    </style>
</head>
<body>
    <header>
        <h1>Site Title</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>          
            </ul>
        </nav>
    </header>
    <main>
        <section id="home">
            <h2>Home</h2>
            <p>Welcome content.</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>About content.</p>
        </section>

        <section id="services">
            <h2>Services</h2>
            <p>Services content.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Contact content.</p>
        </section>
    </main>
    <footer>
        <p>&copy; symbol in &ltfooter&gt</p>
    </footer>
</body>
</html>
